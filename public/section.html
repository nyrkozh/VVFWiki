<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Раздел — DevWiki</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="container inner">
        <a href="/" class="logo"><span class="logo-mark">DW</span> DevWiki</a>
        <nav class="nav-links">
          <a href="/">Разделы</a>
          <a href="/admin.html">Админ</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="page-title" id="header">
        <h1>…</h1>
        <p></p>
      </div>
      <div class="toolbar">
        <a id="submit-link" href="#" class="btn btn-primary">Предложить статью</a>
        <a href="/" class="btn">← Все разделы</a>
      </div>
      <div id="articles" class="article-list"></div>
    </main>

    <footer class="site-footer container">DevWiki</footer>

    <script type="module">
      import { api, qs, escapeHtml } from "./js/api.js";

      const slug = qs("slug");
      if (!slug) location.href = "/";

      async function init() {
        const [sections, articles] = await Promise.all([
          api.sections(),
          api.articles({ section: slug, status: "published" }),
        ]);
        const section = sections.find((s) => s.slug === slug);
        if (!section) {
          document.getElementById("header").innerHTML = "<h1>Раздел не найден</h1>";
          return;
        }
        document.title = `${section.title} — DevWiki`;
        document.getElementById("header").innerHTML = `
          <h1>${section.icon} ${escapeHtml(section.title)}</h1>
          <p>${escapeHtml(section.description)}</p>`;
        document.getElementById("submit-link").href = `/submit.html?section=${encodeURIComponent(slug)}`;

        const el = document.getElementById("articles");
        if (!articles.length) {
          el.innerHTML = `<p class="empty-state">Статей пока нет. <a href="/submit.html?section=${slug}">Предложите первую</a>.</p>`;
          return;
        }
        el.innerHTML = articles
          .map(
            (a) => `
          <div class="article-row">
            <div>
              <h3><a href="/article.html?slug=${encodeURIComponent(a.slug)}">${escapeHtml(a.title)}</a></h3>
              <p>${escapeHtml(a.summary)}</p>
              <div style="margin-top:0.4rem">${(a.tags || []).map((t) => `<span class="badge">${escapeHtml(t)}</span>`).join("")}</div>
            </div>
          </div>`
          )
          .join("");
      }
      init().catch(() => {
        document.getElementById("articles").innerHTML =
          '<p class="flash flash-error">Запустите сервер: node server.mjs</p>';
      });
    </script>
  </body>
</html>
