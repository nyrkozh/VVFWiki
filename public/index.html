<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>VVFWiki — вики для программистов</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body { font-family: var(--font-sans); }
      pre.code { font-family: var(--font-mono), monospace; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container inner">
        <a href="/" class="logo"><span class="logo-mark">VVF</span> VVFWiki</a>
        <nav class="nav-links">
          <a href="/" class="active">Разделы</a>
          <a href="/admin.html">Администратор</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <div class="hero-banner">
          <p class="hero-tag">VVFWiki</p>
          <h1>Код и объяснение — <span class="hero-accent">вместе</span></h1>
          <p class="hero-lead">
            Обучающая вики с визуализацией: код и его работа показаны одновременно.
          </p>
          <div class="hero-demo" aria-hidden="true">
            <div class="hero-demo-code">
              <span class="hero-demo-line dim">const data = [1, 2, 3];</span>
              <span class="hero-demo-line">map → <em>[2, 4, 6]</em></span>
            </div>
            <div class="hero-demo-viz">
              <span class="hero-chip">1</span>
              <span class="hero-chip">2</span>
              <span class="hero-chip">3</span>
              <span class="hero-demo-arrow">→</span>
              <span class="hero-chip active">2</span>
              <span class="hero-chip active">4</span>
              <span class="hero-chip active">6</span>
            </div>
          </div>
        </div>
      </section>
      <div id="sections" class="section-grid">
        <p class="empty-state">Загрузка разделов…</p>
      </div>
    </main>

    <footer class="site-footer container">
      VVFWiki — обучающая платформа для разработчиков
    </footer>

    <script type="module">
      import { api, escapeHtml, formatLoadError } from "./js/api.js";

      async function init() {
        const el = document.getElementById("sections");
        try {
          const sections = await api.sections();
          if (!sections.length) {
            el.innerHTML = '<p class="empty-state">Разделов пока нет. Создайте первый в <a href="/admin.html">админке</a>.</p>';
            return;
          }
          const articles = await api.articles({ status: "published" });
          el.innerHTML = sections
            .map((s) => {
              const count = articles.filter((a) => a.sectionSlug === s.slug).length;
              return `
                <article class="card">
                  <a class="card-link" href="/section.html?slug=${encodeURIComponent(s.slug)}">
                    <div class="card-icon">${escapeHtml(s.icon)}</div>
                    <h3>${escapeHtml(s.title)}</h3>
                    <p>${escapeHtml(s.description)}</p>
                    <p style="margin-top:0.6rem;font-size:0.8rem;color:var(--accent)">${count} статей →</p>
                  </a>
                </article>`;
            })
            .join("");
        } catch (e) {
          el.innerHTML = `<p class="flash flash-error">${formatLoadError(e)}</p>`;
        }
      }
      init();
    </script>
  </body>
</html>
